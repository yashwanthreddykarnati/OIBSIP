<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OIBSIP Level 2 Task 1 - Calculator">
    <title>OIBSIP Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <section class="calculator" aria-label="Calculator">

            <div class="calculator-header">
                <div>
                    <span class="badge">OIBSIP • LEVEL 2</span>
                    <h1>Calculator</h1>
                </div>
                <span class="status-dot"></span>
            </div>

            <!-- Display -->
            <div class="display-container">
                <div id="expression" class="expression">0</div>
                <div id="result" class="result">0</div>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button class="action" data-action="clear">C</button>
                <button class="action" data-action="backspace" aria-label="Backspace">⌫</button>
                <button class="operator" data-operator="%">%</button>
                <button class="operator" data-operator="/">÷</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operator" data-operator="*">×</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operator" data-operator="-">−</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operator" data-operator="+">+</button>

                <button class="zero" data-number="0">0</button>
                <button data-number=".">.</button>
                <button class="equals" data-action="equals">=</button>

            </div>

            <p class="hint">Keyboard supported • No eval()</p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
